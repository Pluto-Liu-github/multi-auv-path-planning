<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Multi-AUV Task Allocation and Path Planning</title>
  <desc id="desc">Deep ocean blue banner with an illustrative three-dimensional grid and colored AUV routes. MATLAB, GBSOM, and 2D plus 3D simulation.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07192c"/>
      <stop offset="1" stop-color="#0c3550"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#2dd4bf" stop-opacity=".13"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#b7dfef" opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#ocean)"/>
  <rect width="1280" height="420" rx="20" fill="url(#dots)"/>
  <ellipse cx="990" cy="190" rx="330" ry="270" fill="url(#light)"/>
  <path d="M0 361 Q210 322 430 361 T850 361 T1280 342" fill="none" stroke="#57c8e5" stroke-opacity=".13"/>
  <path d="M0 382 Q210 343 430 382 T850 382 T1280 363" fill="none" stroke="#57c8e5" stroke-opacity=".07"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="51" width="30" height="3" rx="1.5" fill="#5eead4"/>
    <text x="102" y="57" fill="#8cbed3" font-size="12" font-weight="600" letter-spacing="2">AUTONOMOUS UNDERWATER VEHICLES</text>
    <text x="58" y="140" fill="#f0f9ff" font-size="64" font-weight="750" letter-spacing="-2">MULTI-AUV</text>
    <text x="61" y="191" fill="#d1e6f2" font-size="30" font-weight="400">Task Allocation</text>
    <text x="61" y="231" fill="#d1e6f2" font-size="30" font-weight="400">&amp; Path Planning</text>
    <text x="62" y="272" fill="#8cbed3" font-size="15">Cooperative planning in 2D and 3D ocean environments.</text>
    <g font-size="12" font-weight="600" letter-spacing="1">
      <rect x="62" y="307" width="104" height="30" rx="6" fill="#163a51" stroke="#2a526b"/>
      <text x="114" y="327" text-anchor="middle" fill="#c5e6fa">MATLAB</text>
      <rect x="178" y="307" width="104" height="30" rx="6" fill="#123e44" stroke="#226568"/>
      <text x="230" y="327" text-anchor="middle" fill="#76ebd4">GBSOM</text>
      <rect x="294" y="307" width="104" height="30" rx="6" fill="#163a51" stroke="#2a526b"/>
      <text x="346" y="327" text-anchor="middle" fill="#c5e6fa">2D + 3D</text>
    </g>
  </g>
  <!-- Concept illustration, not a measured trajectory. -->
  <g fill="none" stroke="#47768b" stroke-width="1">
    <path d="M730 250 L935 345 L1160 240 L955 145 Z" stroke-opacity=".65"/>
    <path d="M730 250 V96 L955 12 L1160 96 V240 M730 96 L935 191 L1160 96 M935 191 V345" stroke-opacity=".3" transform="translate(0 35) scale(1 .9)"/>
    <g stroke-opacity=".22">
      <path d="M771 269 L996 164 M812 288 L1037 183 M853 307 L1078 202 M894 326 L1119 221"/>
      <path d="M775 229 L980 324 M820 208 L1025 303 M865 187 L1070 282 M910 166 L1115 261"/>
