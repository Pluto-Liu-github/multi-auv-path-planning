    <circle cx="820" cy="274" r="6" fill="#fbbf69"/>
    <circle cx="841" cy="284" r="6" fill="#a5a3ff"/>
    <circle cx="862" cy="294" r="6" fill="#f39db7"/>
  </g>
  <g fill="#0d2b40" stroke-width="2">
    <circle cx="1032" cy="137" r="6" stroke="#56c5f5"/>
    <circle cx="1134" cy="170" r="6" stroke="#5eead4"/>
    <circle cx="853" cy="139" r="6" stroke="#fbbf69"/>
    <circle cx="1124" cy="245" r="6" stroke="#a5a3ff"/>
    <circle cx="1019" cy="320" r="6" stroke="#f39db7"/>
    <circle cx="945" cy="100" r="6" stroke="#56c5f5"/>
  </g>
  <text x="951" y="385" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#82adc2" letter-spacing="2">PLAN · ALLOCATE · NAVIGATE</text>
</svg>
